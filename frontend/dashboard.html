<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company dashboard | BuildWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-building-gear me-2"></i>BuildWise</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Estimator</a></li>
          <li class="nav-item"><a class="nav-link" href="compare.html">Compare quotes</a></li>
          <li class="nav-item"><a class="btn btn-brand btn-sm" href="register.html">Register your company</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <h1>Company dashboard</h1>
      <p>See the requests you received and send your quotes.</p>
    </div>
  </header>

  <main class="container overlap">

    <div class="row justify-content-center" id="login-card">
      <div class="col-md-8 col-lg-5">
        <section class="card p-4 p-md-5">
          <h2 class="section-title h4 mb-4">Log in</h2>
          <form id="login-form">
            <div class="mb-3"><label class="form-label" for="l_user">Username</label><input id="l_user" class="form-control" required></div>
            <div class="mb-3"><label class="form-label" for="l_pass">Password</label><input id="l_pass" type="password" class="form-control" required></div>
            <button type="submit" class="btn btn-brand btn-lg w-100">Log in</button>
          </form>
          <p id="login-msg" class="error mt-3 mb-0"></p>
          <p class="mt-3 mb-0">New company? <a href="register.html">Register here</a></p>
        </section>
      </div>
    </div>

    <section class="card p-4 p-md-5" id="dash-card" hidden>
      <div class="d-flex align-items-center gap-3 mb-2">
        <h2 id="welcome" class="section-title h4 mb-0 flex-grow-1"></h2>
        <button id="logout" class="btn btn-outline-secondary" type="button">Log out</button>
      </div>
      <p id="verify-note" class="muted"></p>
      <h3 class="h5 mt-3 mb-3">Quote requests received</h3>
      <div id="requests"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-3">
      <div class="brand"><i class="bi bi-building-gear me-2"></i>BuildWise</div>
      <small>Built by <a href="https://github.com/CodeWithMukesh01">Mukesh</a></small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
