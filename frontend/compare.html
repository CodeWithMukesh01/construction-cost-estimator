<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare quotes | BuildWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-building-gear me-2"></i>BuildWise</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Estimator</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Company login</a></li>
          <li class="nav-item"><a class="btn btn-brand btn-sm" href="register.html">Register your company</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <h1>Compare your quotes</h1>
      <p>Enter the reference code you received and the phone number you used.</p>
    </div>
  </header>

  <main class="container overlap">
    <section class="card p-4 p-md-5 mb-4">
      <form id="compare-form" class="row g-3 align-items-end">
        <div class="col-md-5"><label class="form-label" for="ref">Reference code</label><input id="ref" class="form-control form-control-lg" required placeholder="e.g. 9F3A12BC"></div>
        <div class="col-md-4"><label class="form-label" for="phone">Phone number</label><input id="phone" type="tel" class="form-control form-control-lg" required></div>
        <div class="col-md-3"><button type="submit" class="btn btn-brand btn-lg w-100">Show quotes</button></div>
      </form>
      <p id="msg" class="error mt-3 mb-0"></p>
    </section>

    <section class="card p-4 p-md-5" id="result-card" hidden>
      <h2 class="section-title h4 mb-4">Quotes side by side</h2>
      <div class="table-wrap"><table id="compare-table" class="table align-middle"></table></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-3">
      <div class="brand"><i class="bi bi-building-gear me-2"></i>BuildWise</div>
      <small>Built by <a href="https://github.com/CodeWithMukesh01">Mukesh</a></small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = "http://127.0.0.1:8000/api";
    const $ = (id) => document.getElementById(id);
    const inr = (n) => (n == null ? "–" : "₹" + Number(n).toLocaleString("en-IN"));

    try {
      $("ref").value = localStorage.getItem("last_ref") || "";
      $("phone").value = localStorage.getItem("last_phone") || "";
    } catch (_) {}

    $("compare-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("msg").textContent = "";
      $("result-card").hidden = true;
      const url = `${API}/compare/?ref=${encodeURIComponent($("ref").value.trim())}` +
                  `&phone=${encodeURIComponent($("phone").value.trim())}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");
        render(data);
      } catch (err) {
        $("msg").textContent = err.message;
      }
    });

    function render(list) {
      const table = $("compare-table");
      table.innerHTML = "";
      const quoted = list.filter((c) => c.company_quote != null);
      const lowest = quoted.length ? Math.min(...quoted.map((c) => c.company_quote)) : null;

      const rows = [
        ["Company", (c) => c.company],
        ["City", (c) => c.city],
        ["Rating", (c) => "⭐ " + c.rating],
        ["Experience", (c) => c.years_experience + " yrs"],
        ["Projects done", (c) => c.projects_completed],
        ["Your estimate", (c) => inr(c.your_estimate)],
        ["Their quote", (c) => (c.company_quote == null ? "Waiting for quote" : inr(c.company_quote))],
        ["Vs your estimate", (c) => {
          if (c.company_quote == null || !c.your_estimate) return "–";
          const d = ((c.company_quote - c.your_estimate) / c.your_estimate) * 100;
          return (d > 0 ? "+" : "") + d.toFixed(1) + "%";
        }],
        ["Note", (c) => c.company_note || "–"],
        ["Contact", (c) => c.company_phone || "–"],
      ];

      rows.forEach(([label, fn]) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.textContent = label;
        tr.appendChild(th);
        list.forEach((c) => {
          const td = document.createElement("td");
          td.textContent = fn(c);
          if (label === "Their quote" && c.company_quote != null && c.company_quote === lowest) {
            td.className = "best";
            td.textContent += "  ✔ lowest";
          }
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      $("result-card").hidden = false;
    }
  </script>
</body>
</html>
