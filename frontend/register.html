<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="tag"><a href="index.html">← Back to estimator</a></p>
    <h1>Register your construction company</h1>
    <p>Get qualified leads. An admin verifies your company before it is listed.</p>
  </header>
  <main>
    <section class="card">
      <form id="register-form">
        <label>Username <input id="username" required></label>
        <label>Password (min 6 characters) <input id="password" type="password" minlength="6" required></label>
        <label>Company name <input id="name" required></label>
        <label>City <input id="city" required></label>
        <label>Phone <input id="phone" type="tel" required></label>
        <label>Years of experience <input id="years" type="number" min="0" value="0"></label>
        <label>About your company <textarea id="description" rows="3"></textarea></label>
        <button type="submit">Register</button>
      </form>
      <p id="msg" class="muted"></p>
      <p>Already registered? <a href="dashboard.html">Log in</a></p>
    </section>
  </main>
  <script>
    const API = "http://127.0.0.1:8000/api";
    const $ = (id) => document.getElementById(id);

    $("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        username: $("username").value.trim(),
        password: $("password").value,
        name: $("name").value.trim(),
        city: $("city").value.trim(),
        phone: $("phone").value.trim(),
        years_experience: Number($("years").value || 0),
        description: $("description").value.trim(),
      };
      try {
        const res = await fetch(`${API}/company/register/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          const first = Object.values(data)[0];
          throw new Error(Array.isArray(first) ? first[0] : (data.message || "Registration failed."));
        }
        $("msg").textContent = data.message;
        $("register-form").reset();
      } catch (err) {
        $("msg").textContent = err.message;
      }
    });
  </script>
</body>
</html>
