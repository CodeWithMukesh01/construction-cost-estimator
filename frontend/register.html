<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register your company | BuildWise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-building-gear me-2"></i>BuildWise</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Estimator</a></li>
          <li class="nav-item"><a class="nav-link" href="compare.html">Compare quotes</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Company login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <h1>Register your construction company</h1>
      <p>Get qualified leads. An admin verifies your company before it is listed.</p>
    </div>
  </header>

  <main class="container overlap">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <section class="card p-4 p-md-5">
          <form id="register-form" class="row g-3">
            <div class="col-md-6"><label class="form-label" for="username">Username</label><input id="username" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label" for="password">Password (min 6 characters)</label><input id="password" type="password" class="form-control" minlength="6" required></div>
            <div class="col-12"><label class="form-label" for="name">Company name</label><input id="name" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label" for="city">City</label><input id="city" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label" for="phone">Phone</label><input id="phone" type="tel" class="form-control" required></div>
            <div class="col-12"><label class="form-label" for="years">Years of experience</label><input id="years" type="number" class="form-control" min="0" value="0"></div>
            <div class="col-12"><label class="form-label" for="description">About your company</label><textarea id="description" class="form-control" rows="3"></textarea></div>
            <div class="col-12"><button type="submit" class="btn btn-brand btn-lg w-100">Register</button></div>
          </form>
          <p id="msg" class="muted mt-3 mb-0"></p>
          <p class="mt-3 mb-0">Already registered? <a href="dashboard.html">Log in</a></p>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-3">
      <div class="brand"><i class="bi bi-building-gear me-2"></i>BuildWise</div>
      <small>Built by <a href="https://github.com/CodeWithMukesh01">Mukesh</a></small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = "https://construction-cost-estimator-1.onrender.com/api";
    const $ = (id) => document.getElementById(id);

    $("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        username: $("username").value.trim(),
        password: $("password").value,
        name: $("name").value.trim(),
        city: $("city").value.trim(),
        phone: $("phone").value.trim(),
        years_experience: Number($("years").value || 0),
        description: $("description").value.trim(),
      };
      try {
        const res = await fetch(`${API}/company/register/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          const first = Object.values(data)[0];
          throw new Error(Array.isArray(first) ? first[0] : (data.message || "Registration failed."));
        }
        $("msg").textContent = data.message;
        $("register-form").reset();
      } catch (err) {
        $("msg").textContent = err.message;
      }
    });
  </script>
</body>
</html>
